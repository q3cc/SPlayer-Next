name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ios-ipados
    paths:
      - ".github/workflows/ios-unsigned.yml"
      - "src/**"
      - "src-tauri/**"
      - "shared/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "uno.config.ts"

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: iPhone and iPad unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Xcode project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Install the SPlayer iOS icon set
        shell: bash
        run: |
          set -euo pipefail
          icon_set="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          cp src-tauri/icons/ios/*.png "$icon_set/"
          cmp src-tauri/icons/ios/AppIcon-512@2x.png "$icon_set/AppIcon-512@2x.png"

      - name: Build the unsigned iOS IPA
        run: pnpm tauri ios build --ci --no-sign

      - name: Collect unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          ipa_path="$(find src-tauri -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "Tauri did not produce an IPA" >&2
            exit 1
          fi
          cp "$ipa_path" SPlayer-Next-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-iOS-unsigned-${{ github.sha }}
          path: SPlayer-Next-iOS-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build the iPad simulator application
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            simulator_target="aarch64-sim"
          else
            simulator_target="x86_64"
          fi
          echo "IOS_SIMULATOR_TARGET=$simulator_target" >> "$GITHUB_ENV"
          pnpm tauri ios build --ci --no-sign --target "$simulator_target"

      - name: Smoke test first and second launch on iPad
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail

          timed() {
            local seconds="$1"
            shift
            perl -e 'alarm shift; exec @ARGV' "$seconds" "$@"
          }

          capture() {
            local name="$1"
            if timed 30 xcrun simctl io "$device_id" screenshot "ios-smoke/$name.png"; then
              return
            fi
            echo "$name simulator screenshot timed out; trying the Simulator window" \
              | tee "ios-smoke/$name-screenshot-error.txt"
            timed 20 screencapture -x "ios-smoke/$name-host.png" || true
          }

          app_path="src-tauri/gen/apple/build/$IOS_SIMULATOR_TARGET/SPlayer Next.app"
          if [[ -z "$app_path" ]]; then
            echo "Tauri did not produce an iOS Simulator app" >&2
            exit 1
          fi

          device_id="$(xcrun simctl list devices available | sed -nE '/iPad/ s/.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)"
          if [[ -z "$device_id" ]]; then
            echo "No available iPad simulator was found" >&2
            xcrun simctl list devices available
            exit 1
          fi

          mkdir -p ios-smoke
          printf 'app=%s\ndevice=%s\n' "$app_path" "$device_id" | tee ios-smoke/environment.txt
          timed 30 xcrun simctl boot "$device_id" 2>ios-smoke/boot-error.txt || true
          open -a Simulator --args -CurrentDeviceUDID "$device_id" || true
          timed 300 xcrun simctl bootstatus "$device_id" -b | tee ios-smoke/bootstatus.txt
          timed 240 xcrun simctl install "$device_id" "$app_path" 2>ios-smoke/install-error.txt

          timed 90 xcrun simctl launch --terminate-running-process --console "$device_id" \
            top.imsyy.splayer-next.ios > ios-smoke/first-console.log 2>&1 &
          first_console_pid=$!
          sleep 15
          capture first-launch
          timed 30 xcrun simctl terminate "$device_id" top.imsyy.splayer-next.ios || true
          wait "$first_console_pid" || true

          timed 90 xcrun simctl launch --console "$device_id" top.imsyy.splayer-next.ios \
            > ios-smoke/second-console.log 2>&1 &
          second_console_pid=$!
          sleep 10
          capture second-launch
          timed 30 xcrun simctl terminate "$device_id" top.imsyy.splayer-next.ios || true
          wait "$second_console_pid" || true

          if ! compgen -G 'ios-smoke/first-launch*.png' > /dev/null; then
            echo "No first-launch screenshot was captured" >&2
            exit 1
          fi
          if ! compgen -G 'ios-smoke/second-launch*.png' > /dev/null; then
            echo "No second-launch screenshot was captured" >&2
            exit 1
          fi

      - name: Upload iPad smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-iPad-smoke-${{ github.sha }}
          path: |
            ios-smoke
            src-tauri/gen/apple/**/Assets.xcassets
            src-tauri/gen/apple/**/*.plist
          if-no-files-found: warn
          retention-days: 7

      - name: Upload raw application bundle for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-iOS-build-logs-${{ github.sha }}
          path: |
            src-tauri/gen/apple
            src-tauri/target/**/release/bundle
          if-no-files-found: ignore
          retention-days: 7
