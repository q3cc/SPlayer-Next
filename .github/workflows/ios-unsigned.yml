name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ios-ipados
    paths:
      - ".github/workflows/ios-unsigned.yml"
      - "src/**"
      - "src-tauri/**"
      - "shared/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "uno.config.ts"

permissions:
  contents: read

concurrency:
  # macOS runner 偶尔会卡在收尾阶段，按提交隔离并发组，避免阻塞新修复的验证。
  group: ios-unsigned-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: ipa
            name: Unsigned iPhone and iPad IPA
            rust_targets: aarch64-apple-ios
            rust_cache_key: ""
          - kind: smoke
            name: iPad startup smoke test
            rust_targets: aarch64-apple-ios-sim
            rust_cache_key: debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust_cache_key }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Xcode project
        run: pnpm tauri ios init --ci --skip-targets-install

      - name: Install the SPlayer iOS icon set
        shell: bash
        run: |
          set -euo pipefail
          icon_set="src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset"
          cp src-tauri/icons/ios/*.png "$icon_set/"
          cmp src-tauri/icons/ios/AppIcon-512@2x.png "$icon_set/AppIcon-512@2x.png"

      - name: Build the unsigned iOS IPA
        if: matrix.kind == 'ipa'
        run: pnpm tauri ios build --ci --no-sign

      - name: Collect unsigned IPA
        if: matrix.kind == 'ipa'
        shell: bash
        run: |
          set -euo pipefail

          ipa_path="$(find src-tauri -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "Tauri did not produce an IPA" >&2
            exit 1
          fi
          cp "$ipa_path" SPlayer-Next-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        if: matrix.kind == 'ipa'
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-iOS-unsigned-${{ github.sha }}
          path: SPlayer-Next-iOS-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build the iPad simulator application
        if: matrix.kind == 'smoke'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            simulator_target="aarch64-sim"
          else
            simulator_target="x86_64"
          fi
          device_id="$(xcrun simctl list devices available | sed -nE '/iPad/ s/.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)"
          if [[ -z "$device_id" ]]; then
            echo "No available iPad simulator was found" >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_TARGET=$simulator_target" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_DEVICE=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id" >/dev/null 2>&1 || true
          pnpm tauri ios build --debug --ci --no-sign --target "$simulator_target"

      - name: Smoke test first and second launch on iPad
        if: matrix.kind == 'smoke'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          timed() {
            local seconds="$1"
            shift
            perl -e 'alarm shift; exec @ARGV' "$seconds" "$@"
          }

          capture() {
            local name="$1"
            if timed 6 xcrun simctl io "$device_id" screenshot "ios-smoke/$name.png"; then
              return
            fi
            echo "$name simulator screenshot timed out; trying the Simulator window" \
              | tee "ios-smoke/$name-screenshot-error.txt"
            timed 6 screencapture -x "ios-smoke/$name-host.png" || true
          }

          wait_for_mount() {
            local boot_log="$1"
            for _ in {1..30}; do
              if [[ -f "$boot_log" ]] && grep -Fxq 'vue-mounted' "$boot_log"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          launch_app() {
            local name="$1"
            shift
            local output="ios-smoke/$name.txt"

            for attempt in 1 2; do
              xcrun simctl launch "$@" "$device_id" top.imsyy.splayer-next.ios \
                >"$output" 2>&1 &
              local launcher_pid=$!

              for _ in {1..20}; do
                if [[ -f "$boot_log" ]] && grep -Fxq 'native-entry' "$boot_log"; then
                  kill -KILL "$launcher_pid" 2>/dev/null || true
                  wait "$launcher_pid" 2>/dev/null || true
                  return 0
                fi
                sleep 1
              done

              kill -KILL "$launcher_pid" 2>/dev/null || true
              wait "$launcher_pid" 2>/dev/null || true
              printf '\nlaunch attempt %s did not reach native-entry\n' "$attempt" >> "$output"
            done
            return 1
          }

          app_path="$(find src-tauri/gen/apple/build -type d -name '*.app' \
            ! -path '*.xcarchive/*' -print -quit)"
          if [[ -z "$app_path" || ! -d "$app_path" ]]; then
            echo "Tauri did not produce an iOS Simulator app" >&2
            find src-tauri/gen/apple/build -maxdepth 4 -print >&2 || true
            exit 1
          fi
          app_path="$(cd "$(dirname "$app_path")" && pwd)/$(basename "$app_path")"

          device_id="$IOS_SIMULATOR_DEVICE"

          mkdir -p ios-smoke
          printf 'app=%s\ndevice=%s\n' "$app_path" "$device_id" | tee ios-smoke/environment.txt
          timed 300 xcrun simctl bootstatus "$device_id" -b | tee ios-smoke/bootstatus.txt
          timed 240 xcrun simctl install "$device_id" "$app_path" 2>ios-smoke/install-error.txt
          data_container="$(xcrun simctl get_app_container "$device_id" top.imsyy.splayer-next.ios data)"
          boot_log="$data_container/tmp/splayer-boot.log"
          rm -f "$boot_log"

          launch_app first-launch --terminate-running-process || true
          first_mounted=1
          wait_for_mount "$boot_log" || first_mounted=0
          capture first-launch
          cp "$boot_log" ios-smoke/first-boot.log 2>/dev/null || true
          timed 5 xcrun simctl terminate "$device_id" top.imsyy.splayer-next.ios || true

          mv "$boot_log" ios-smoke/first-boot-complete.log 2>/dev/null || true
          launch_app second-launch || true
          second_mounted=1
          wait_for_mount "$boot_log" || second_mounted=0
          capture second-launch
          cp "$boot_log" ios-smoke/second-boot.log 2>/dev/null || true
          if [[ "$second_mounted" != 1 ]]; then
            timed 10 xcrun simctl spawn "$device_id" log show --last 2m --style compact \
              --predicate 'process == "SPlayer Next"' > ios-smoke/second-console.log 2>&1 || true
          fi
          timed 5 xcrun simctl terminate "$device_id" top.imsyy.splayer-next.ios || true

          if ! compgen -G 'ios-smoke/first-launch*.png' > /dev/null; then
            echo "No first-launch screenshot was captured" >&2
            exit 1
          fi
          if ! compgen -G 'ios-smoke/second-launch*.png' > /dev/null; then
            echo "No second-launch screenshot was captured" >&2
            exit 1
          fi
          if [[ "$first_mounted" != 1 || "$second_mounted" != 1 ]]; then
            echo "The application did not reach vue-mounted on both launches" >&2
            exit 1
          fi

      - name: Upload iPad smoke-test diagnostics
        if: always() && matrix.kind == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: SPlayer-Next-iPad-smoke-${{ github.sha }}
          path: ios-smoke
          if-no-files-found: warn
          retention-days: 7
