name: iPad song playback and lyric PiP test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-playback-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ios-playback-simulator
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build instrumented simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-playback
          pnpm tauri ios init --ci --skip-targets-install
          cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
          if [[ "$(uname -m)" == arm64 ]]; then target=aarch64-sim; else target=x86_64; fi
          VITE_MOBILE_PLAYBACK_TEST=1 pnpm tauri ios build --debug --ci --no-sign --target "$target" \
            2>&1 | tee ios-playback/build.log
      - name: Boot and install on iPad
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timed() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          device_id="$(xcrun simctl list devices available | sed -nE '/iPad.*11-inch/ s/.*\(([0-9A-F-]{36})\).*/\1/p' | head -1)"
          test -n "$device_id"
          echo "IOS_PLAYBACK_DEVICE=$device_id" >> "$GITHUB_ENV"
          app_path="$(find src-tauri/gen/apple/build -type d -name '*.app' ! -path '*.xcarchive/*' -print -quit)"
          test -d "$app_path"
          timed 30 xcrun simctl shutdown "$device_id" || true
          timed 30 xcrun simctl boot "$device_id"
          timed 300 xcrun simctl bootstatus "$device_id" -b | tee ios-playback/boot.log
          timed 120 xcrun simctl install "$device_id" "$app_path"
          xcrun simctl status_bar "$device_id" override --time '9:41' --batteryState charged --batteryLevel 100
      - name: Play 千本樱 and exercise lyric PiP
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec scripts/ios-layout-tests/project.yml
          xcodebuild test -project scripts/ios-layout-tests/SPlayerLayoutTests.xcodeproj \
            -scheme LayoutTests -destination "platform=iOS Simulator,id=$IOS_PLAYBACK_DEVICE" \
            -only-testing:LayoutTests/PlaybackTests -parallel-testing-enabled NO \
            -resultBundlePath ios-playback/playback.xcresult CODE_SIGNING_ALLOWED=NO \
            > ios-playback/test.log 2>&1
      - name: Collect screenshots and application logs
        if: always()
        shell: bash
        run: |
          mkdir -p ios-playback
          if [[ -d ios-playback/playback.xcresult ]]; then
            xcrun xcresulttool export attachments --path ios-playback/playback.xcresult \
              --output-path ios-playback/screenshots || true
          fi
          if [[ -n "${IOS_PLAYBACK_DEVICE:-}" ]]; then
            perl -e 'alarm shift; exec @ARGV' 20 xcrun simctl io "$IOS_PLAYBACK_DEVICE" screenshot ios-playback/final-screen.png || true
            data_container="$(xcrun simctl get_app_container "$IOS_PLAYBACK_DEVICE" top.imsyy.splayer-next.ios data)"
            cp -R "$data_container/Documents/logs" ios-playback/app-logs || true
            perl -e 'alarm shift; exec @ARGV' 20 xcrun simctl spawn "$IOS_PLAYBACK_DEVICE" log show \
              --last 10m --style compact --predicate 'process CONTAINS "splayer"' \
              > ios-playback/system.log 2>&1 || true
          fi
          tail -100 ios-playback/test.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPad-Senbonzakura-PiP-${{ github.sha }}
          path: ios-playback
          if-no-files-found: warn
          retention-days: 7
