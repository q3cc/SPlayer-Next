[package]
name = "splayer-next-mobile"
version = "1.2.0-alpha.1"
description = "SPlayer Next for iOS and iPadOS"
authors = ["SPlayer-Dev contributors"]
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "splayer_next_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["AVAudioSession", "AVAudioSessionTypes"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
